[package]
name = "yonodex"
version = "0.1.0"
description = "Yonodex - Decentralized Exchange"
authors = ["Yonodex Team"]
license = "AGPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2.6.0"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher", "bundled-sqlcipher-vendored-openssl"] }
argon2 = "0.5.3"
rand = "0.9.5"
hex = "0.4.3"
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
tokio = { version = "1.53.1", features = ["full"] }
